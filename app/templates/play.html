{% extends "base.html" %}

{% block title %}Game Name - Play{% endblock %}

{% block extra_head %}
    <script src="{{ url_for('static', filename='game.js')}}" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
{% endblock %}

{% block content %}s
    <div class="items-center flex justify-center h-screen">
        <div class="shadow-[0_0_2rem_var(--secondary)] rounded-3xl h-[500px] w-[900px]">
            <div class="absolute w-[900px] h-[500px] hidden items-center justify-center z-10 backdrop-brightness-[80%] rounded-3xl" id="end">
                <div>
                    <h1 class="text-5xl text-[var(--primary)] py-5">
                        Run ended!
                    </h1>
                    <h2 class="text-2xl text-[var(--primary)]">
                        Your Stats:
                    </h2>
                    <h3 class="text-xl hidden"  id="finalTime">
                        Final Time: 0 seconds
                    </h3>
                    <h3 class="text-xl hidden" id="totalJumps">
                        Total Jumps: 0
                    </h3>
                    <h3 class="text-xl hidden" id="totalScore">
                        Total Score: 0
                    </h3>
                </div>
                

            </div>
            <div class="relative w-full">
                <div class="absolute p-2 z-10">
                    <button onclick="end()">
                        Die
                    </button>
                </div>
                <div class="relative ml-[92.5%]">
                    <div class="absolute p-2 rounded-xl m-2 z-10">
                        <button class="" onclick="pauseButton()">
                            <i class="fa fa-pause" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                
            </div>
            <canvas id="gameCanvas" class="absolute" height="500" width="900"></canvas>
            <canvas id="playerCanvas" class="absolute" height="500" width="900"></canvas>
        </div>
    </div>
{% endblock %}

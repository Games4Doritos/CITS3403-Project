<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Game Name{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='globals.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[var(--background)] min-h-screen">
    <!-- Navbar -->
    <div class="bg-[var(--background)] border-b border-b-[var(--primary)] flex p-5 text-[var(--primary)] fixed w-full z-10">
        <div>
            <a href="{{ url_for('index') }}">Home</a>
        </div>
        <div class="ml-auto px-2">
            <!-- This auth button changed to profile button after log in-->
            {% if current_user.is_authenticated %}
                <a href="{{url_for('profile')}}">
                    {{current_user.profile.username if current_user.profile else "My Profile"}}
                </a>
            {% else %}
                <a href="{{ url_for('auth') }}">
                    Log In / Sign Up
                </a>
            {% endif %}
        </div>
    </div>

    <!-- Page Content -->
    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>

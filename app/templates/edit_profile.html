{% extends "base.html" %}

{% block title %}Game Name - Edit Profile{% endblock %}

{% block content %}
<section class="w-full flex justify-center items-center pt-24 py-7 px-6">
    <div class="w-full max-w-2xl rounded-3xl border border-[var(--primary)] bg-[rgba(255,255,255,0.02)] p-6 shadow-[0_0_1.2rem_var(--secondary)]">
        
        <h1 class="text-center text-5xl text-[var(--primary)] mb-2">Edit Profile</h1>
        <p class="text-center text-[var(--secondary)] mb-6">Update your player details</p>

        <form class="space-y-4">
            <div>
                <label class="block text-[var(--secondary)] mb-2">Username</label>
                <input type="text" value="Player123" class="w-full rounded-xl bg-transparent border border-[var(--primary)] px-4 py-3 text-white focus:outline-none">
            </div>

            <div>
                <label class="block text-[var(--secondary)] mb-2">Email</label>
                <input type="email" value="player123@email.com" class="w-full rounded-xl bg-transparent border border-[var(--primary)] px-4 py-3 text-white focus:outline-none">
            </div>

            <div>
                <label class="block text-[var(--secondary)] mb-2">Favourite Mode</label>
                <input type="text" value="Speed Run" class="w-full rounded-xl bg-transparent border border-[var(--primary)] px-4 py-3 text-white focus:outline-none">
            </div>

            <div class="flex flex-col md:flex-row justify-center gap-4 pt-4">
                <button type="submit" class="bg-[var(--primary)] text-white px-6 py-3 rounded-2xl shadow-[0_0_20px_var(--secondary)] hover:opacity-90 transition">
                    Save Changes
                </button>

                <a href="{{ url_for('profile') }}" class="border border-[var(--primary)] text-[var(--primary)] px-6 py-3 rounded-2xl text-center hover:bg-[rgba(255,255,255,0.05)] transition">
                    Back to Profile
                </a>
            </div>
        </form>

    </div>
</section>
{% endblock %}
